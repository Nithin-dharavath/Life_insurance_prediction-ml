[project]
name = "life-insurance-prediction"
version = "1.1.0"
description = "ML service that predicts insurance premium categories"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.133.0",
    "uvicorn>=0.41.0",
    "scikit-learn>=1.8.0",
    "pydantic>=2.12.0",
    "pandas>=2.3.0",
    "numpy>=2.4.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["city*", "features*", "model*", "schema*"]
exclude = ["data*", "tests*", "venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["app", "features", "schema", "model", "city"]
omit = ["model/train.py", "model/regression_test.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
show_missing = true
