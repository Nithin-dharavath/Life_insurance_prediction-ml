[project]
name = "life-insurance-prediction"
version = "1.1.0"
description = "ML service that predicts insurance premium categories"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.133.0",
    "uvicorn>=0.41.0",
    "scikit-learn>=1.8.0",
    "pydantic>=2.12.0",
    "pandas>=2.3.0",
    "numpy>=2.4.0",
    "streamlit>=1.54.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
